name: Android build

on:
  push:
    branches:
      - main
      - build-validation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test Android app
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.2.11394342" "cmake;3.22.1"

      - name: Build debug variants
        run: bash ./gradlew --no-daemon assembleDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: Rockstar-debug-APKs
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Run unit tests
        run: bash ./gradlew --no-daemon :app:testVer_debugDebugUnitTest
