name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths:
      - "app/**"
      - "gradle/**"
      - ".github/workflows/build-apk.yml"
      - "build.gradle"
      - "gradle.properties"
      - "settings.gradle"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;26.2.11394342"

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleVer_debugDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rockstar-debug-apk
          path: app/build/outputs/apk/ver_debug/debug/mobile-game-debug.apk
          if-no-files-found: error
          retention-days: 7
